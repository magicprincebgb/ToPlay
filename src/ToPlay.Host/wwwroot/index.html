<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ToPlay</title>
  <link rel="manifest" href="/manifest.webmanifest?v=2.2.1" />
  <!-- The ?v= stamp changes with every release so phones and browsers pick up a
       refreshed icon instead of keeping the one they cached long ago. -->
  <link rel="icon" href="/favicon.ico?v=2.2.1" sizes="any" />
  <link rel="icon" type="image/png" href="/icon-192.png?v=2.2.1" />
  <!-- iOS "Add to Home Screen" only picks up a PNG it can fetch and match by
       size; the precomposed variants are what older iPhones look for. Without
       these it silently falls back to a screenshot of the page. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2.2.1" />
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png?v=2.2.1" />
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png?v=2.2.1" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=2.2.1" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ToPlay" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/boot.js"></script>
</head>
<body></body>
</html>
